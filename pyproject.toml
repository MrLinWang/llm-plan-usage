[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-usage"
version = "0.1.0"
description = "Unified CLI tool to monitor LLM coding plan/token usage across multiple platforms"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "click>=8.1",
    "tomli_w>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
llm-usage = "llm_usage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_usage = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]