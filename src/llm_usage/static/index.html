<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>LLM 用量总览</title>
<style>
  :root {
    --bg: #16181d;
    --fg: #d7dae0;
    --dim: #7a7f8a;
    --sep: #3a3f4a;
    --green: #4caf50;
    --yellow: #ffb300;
    --red: #ef5350;
    --cyan: #56b6c2;
    --track: #2c313c;
    --surface: #1c2027;
    --hover: rgba(255, 255, 255, 0.035);
    --glow: #1b2230;
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  }
  /* 浅色主题:覆盖同名变量,强调色取深一档以保证白底对比度 */
  html[data-theme="light"] {
    --bg: #f5f6f8;
    --fg: #24292f;
    --dim: #6e7781;
    --sep: #d0d7de;
    --green: #1a7f37;
    --yellow: #9a6700;
    --red: #cf222e;
    --cyan: #0a7ea4;
    --track: #e2e5ea;
    --surface: #ffffff;
    --hover: rgba(0, 0, 0, 0.03);
    --glow: #e9edf3;
    --shadow: 0 10px 30px rgba(27, 31, 36, 0.1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    background: radial-gradient(1100px 520px at 78% -8%, var(--glow), var(--bg) 62%);
    background-attachment: fixed;
    color: var(--fg);
    font-family: "Sarasa Mono SC", "Noto Sans Mono CJK SC", "PingFang SC",
                 "Microsoft YaHei", Consolas, "Courier New", monospace;
    font-size: 14px;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  #app { max-width: 1200px; margin: 0 auto; }
  .card {
    background: var(--surface);
    border: 1px solid var(--sep);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 14px 18px 12px;
    transition: background-color 0.25s ease, border-color 0.25s ease;
  }
  .card-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }
  /* 平台卡片网格:够宽时两列,窄屏自动单列 */
  #platforms {
    margin-top: 12px;
    display: grid;
    gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr));
  }
  .platform-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 8px;
    margin-bottom: 2px;
    border-bottom: 1px solid var(--sep);
  }
  .platform-name { font-weight: bold; }
  .platform-err, .platform-empty { padding: 2px 0; }
  .platform-err { color: var(--red); }
  #theme-toggle {
    flex: none;
    padding: 5px 16px;
    font: inherit;
    font-size: 13px;
    color: var(--dim);
    background: transparent;
    border: 1px solid var(--sep);
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.2s ease, border-color 0.2s ease,
                background-color 0.2s ease, box-shadow 0.2s ease;
  }
  #theme-toggle:hover {
    color: var(--fg);
    border-color: var(--dim);
    background: var(--hover);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  }
  #theme-toggle:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
  }
  .title {
    font-weight: bold;
    font-size: 17px;
    letter-spacing: 0.02em;
    margin-bottom: 6px;
    background: linear-gradient(90deg, var(--cyan), var(--green));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .status {
    display: flex;
    align-items: center;
    color: var(--dim);
    font-size: 13px;
    min-height: 1.2em;
  }
  .status::before {
    content: "";
    flex: none;
    width: 8px;
    height: 8px;
    margin-right: 8px;
    border-radius: 50%;
    background: var(--green);
  }
  .status.err { color: var(--red); }
  .status.err::before { background: var(--red); }
  table {
    width: 100%;
    border-collapse: collapse;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  th {
    text-align: left;
    color: var(--dim);
    font-weight: normal;
    font-size: 12px;
    padding: 6px 14px 4px 0;
    border-bottom: 1px solid var(--sep);
  }
  td {
    padding: 3px 14px 3px 0;
    vertical-align: middle;
  }
  th:last-child, td:last-child { padding-right: 0; }
  th.num, td.num { text-align: right; }
  tbody tr:not(.bar-row):hover td { background: var(--hover); }
  .bold { font-weight: bold; }
  .dim { color: var(--dim); }
  .red { color: var(--red); }
  .ok { color: var(--green); font-weight: 600; }
  .bar-row td { padding-top: 0; padding-bottom: 5px; }
  .bar-wrap { display: flex; align-items: center; gap: 10px; }
  .bar-track {
    flex: 1;
    height: 10px;
    background: var(--track);
    border-radius: 999px;
    overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.18);
  }
  .bar-fill {
    height: 100%;
    border-radius: 999px;
    transition: width 0.6s ease;
  }
  .bar-fill.green  { background: linear-gradient(180deg, color-mix(in srgb, var(--green) 78%, white), var(--green)); }
  .bar-fill.yellow { background: linear-gradient(180deg, color-mix(in srgb, var(--yellow) 78%, white), var(--yellow)); }
  .bar-fill.red    { background: linear-gradient(180deg, color-mix(in srgb, var(--red) 78%, white), var(--red)); }
  .bar-label { min-width: 4em; text-align: right; font-weight: 600; }
  .bar-label.green-text  { color: var(--green); }
  .bar-label.yellow-text { color: var(--yellow); }
  .bar-label.red-text    { color: var(--red); }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .status::before { animation: pulse 2s ease-in-out infinite; }
    .status.err::before { animation: none; }
  }
</style>
<script>
// 首屏前确定主题,避免闪烁:localStorage 优先,其次系统偏好,默认深色。
(function () {
  var t = null;
  try { t = localStorage.getItem("llm-usage-theme"); } catch (_) {}
  if (t !== "light" && t !== "dark") {
    t = (window.matchMedia &&
         matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
  }
  document.documentElement.dataset.theme = t;
})();
</script>
</head>
<body>
<div id="app">
  <div class="card">
    <div class="card-head">
      <div>
        <div id="title" class="title">LLM 用量总览</div>
        <div id="status" class="status">加载中…</div>
      </div>
      <button id="theme-toggle" type="button" title="切换浅色/深色主题">浅色</button>
    </div>
  </div>
  <div id="platforms"></div>
</div>
<!-- 平台卡片内的 entry 表格骨架;每个平台卡片克隆一份。 -->
<template id="entry-table">
  <table>
    <thead>
      <tr>
        <th>窗口</th>
        <th class="num">已用</th><th class="num">限额</th><th class="num">剩余</th>
        <th>重置时间</th><th class="num">重置倒计时</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</template>
<script>
"use strict";

var platformsEl = document.getElementById("platforms");
var entryTableTpl = document.getElementById("entry-table");
var statusEl = document.getElementById("status");
var titleEl = document.getElementById("title");

var lastFetchedLocal = null;  // 上次成功获取的本地时间 "HH:MM:SS"
var nextAt = 0;               // 下一次轮询的时间戳(ms)
var pollTimer = 0;
var errorState = null;        // 拉取失败时的错误信息(保留旧卡片)

// ---- 主题切换 ----
// data-theme 由 <head> 中的脚本在首屏前设置;这里同步按钮文字并处理点击。
// 按钮文字显示目标主题(当前深色 → 显示「浅色」)。

var THEME_KEY = "llm-usage-theme";

function syncThemeButton() {
  var light = document.documentElement.dataset.theme === "light";
  document.getElementById("theme-toggle").textContent = light ? "深色" : "浅色";
}

function toggleTheme() {
  var light = document.documentElement.dataset.theme === "light";
  var next = light ? "dark" : "light";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem(THEME_KEY, next); } catch (_) {}
  syncThemeButton();
}

document.getElementById("theme-toggle").addEventListener("click", toggleTheme);
syncThemeButton();

// ---- 格式化 ----
// 以下函数对应 display.py 中的实现：_fmt_value / _to_local_time / _fmt_countdown。
// 数值格式化尽量贴近 Python 的 `:g`（整数去尾，非整数保留约 6 位有效数字）。

function p2(n) { return String(n).padStart(2, "0"); }

// Python 的 `:g`:整数去小数,否则约 6 位有效数字。
function fmtG(v) {
  if (Number.isInteger(v)) return String(v);
  return String(parseFloat(Number(v).toPrecision(6)));
}

// _fmt_value
function fmtValue(v, unit) {
  if (v === null || v === undefined) return "-";
  var num = fmtG(v);
  if (unit === "$") return "$" + num;
  if (unit === "%") return num + "%";
  if (unit === "tokens") return num + " tokens";
  return (num + " " + (unit || "")).trim();
}

// ISO 解析:naive(无 Z 且无 ±HH:MM 偏移)视为 UTC —— 对应 _to_local_time 的规则。
function parseReset(s) {
  if (!s) return null;
  var v = String(s).trim();
  if (!/[Zz]$/.test(v) && !/[+-]\d{2}:?\d{2}$/.test(v)) v += "Z";
  var d = new Date(v);
  return isNaN(d.getTime()) ? null : d;
}

// 本地时间 YYYY-MM-DD HH:MM:SS(手动补零)
function fmtLocal(d) {
  return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()) +
         " " + p2(d.getHours()) + ":" + p2(d.getMinutes()) + ":" + p2(d.getSeconds());
}

function fmtTime(d) {
  return p2(d.getHours()) + ":" + p2(d.getMinutes()) + ":" + p2(d.getSeconds());
}

function fmtLocalMinute(d) {
  return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()) +
         " " + p2(d.getHours()) + ":" + p2(d.getMinutes());
}

// 重置时间列:_to_local_time —— 空 → "-",无法解析 → 原样显示
function fmtResetCell(s) {
  if (!s) return "-";
  var d = parseReset(s);
  if (!d) return s;
  return fmtLocal(d);
}

// _fmt_countdown(逐字一致)
function fmtCountdown(resetAt, now) {
  if (!resetAt) return "-";
  var d = parseReset(resetAt);
  if (!d) return "-";
  var secs = Math.floor((d.getTime() - now.getTime()) / 1000);
  if (secs <= 0) return "已重置";
  var days = Math.floor(secs / 86400);
  var rem = secs % 86400;
  var hours = Math.floor(rem / 3600);
  var minutes = Math.floor((rem % 3600) / 60);
  if (days > 0) return days + "天" + hours + "小时";
  if (hours > 0) return hours + "小时" + minutes + "分";
  return minutes + "分";
}

// 颜色阈值同 CLI:>=95 红,>=80 黄,否则绿
function pctColor(percent) {
  if (percent >= 95) return "red";
  if (percent >= 80) return "yellow";
  return "green";
}

// ---- DOM 构建 ----
// 每个平台一张卡片:卡片头 = 平台名 + 状态;卡片体 = entry 表格
// (每个 entry 占一个数据行 + 一个通栏进度条行)。
// error 平台卡片体显示错误信息;空 entries 平台显示 "无数据"。

function el(tag, cls) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

function td(text, cls, colspan) {
  var cell = el("td", cls);
  cell.textContent = text;
  if (colspan) cell.colSpan = colspan;
  return cell;
}

function dataRow(entry) {
  var tr = el("tr");
  var used, limit, remaining;
  // 特殊行规则(同 _make_data_line)
  if (entry.limit === null && entry.used === 0 && entry.percent !== null) {
    used = limit = remaining = "-";
  } else {
    used = fmtValue(entry.used, entry.unit);
    limit = entry.limit === null ? "∞" : fmtValue(entry.limit, entry.unit);
    remaining = entry.remaining === null ? "-" : fmtValue(entry.remaining, entry.unit);
  }
  tr.appendChild(td(entry.label));
  tr.appendChild(td(used, "num"));
  tr.appendChild(td(limit, "num"));
  tr.appendChild(td(remaining, "num"));
  tr.appendChild(td(fmtResetCell(entry.reset_at), "dim"));
  var cd = td(fmtCountdown(entry.reset_at, new Date()), "num dim cd");
  cd.dataset.reset = entry.reset_at || "";
  tr.appendChild(cd);
  return tr;
}

function barRow(percent) {
  var tr = el("tr", "bar-row");
  var cell = td("", "", 6);
  if (percent !== null && percent !== undefined) {
    var color = pctColor(percent);
    var wrap = el("div", "bar-wrap");
    var track = el("div", "bar-track");
    var fill = el("div", "bar-fill " + color);
    fill.style.width = Math.min(Math.max(percent, 0), 100) + "%";
    track.appendChild(fill);
    var label = el("span", "bar-label " + color + "-text");
    label.textContent = Math.round(percent) + "%";
    wrap.appendChild(track);
    wrap.appendChild(label);
    cell.appendChild(wrap);
  }
  tr.appendChild(cell);
  return tr;
}

function platformCard(p) {
  var card = el("div", "card platform");
  var head = el("div", "platform-head");
  var name = el("span", "platform-name");
  name.textContent = p.display_name;
  head.appendChild(name);
  var state = el("span", p.error ? "red" : "ok");
  state.textContent = p.error ? "错误" : "OK";
  head.appendChild(state);
  card.appendChild(head);
  if (p.error) {
    var err = el("div", "platform-err");
    err.textContent = p.error;
    card.appendChild(err);
    return card;
  }
  if (!p.entries || p.entries.length === 0) {
    var empty = el("div", "platform-empty dim");
    empty.textContent = "无数据";
    card.appendChild(empty);
    return card;
  }
  var frag = entryTableTpl.content.cloneNode(true);
  var body = frag.querySelector("tbody");
  p.entries.forEach(function (entry) {
    body.appendChild(dataRow(entry));
    body.appendChild(barRow(entry.percent));
  });
  card.appendChild(frag);
  return card;
}

function renderPlatforms(platforms) {
  platformsEl.textContent = "";
  platforms.forEach(function (p) {
    platformsEl.appendChild(platformCard(p));
  });
}

// ---- 刷新循环 ----
// 首次加载后立即拉取；成功后按服务端 interval 秒调度下一次轮询。
// 失败时 10 秒后重试，不清空旧卡片。setInterval(1000) 同时维护：
// 1) 状态行中的「下次刷新 Ns」倒计时；2) 各 entry 的「重置倒计时」。

function schedule(sec) {
  clearTimeout(pollTimer);
  nextAt = Date.now() + sec * 1000;
  pollTimer = setTimeout(refresh, sec * 1000);
}

function render(data) {
  var fetched = parseReset(data.fetched_at);
  lastFetchedLocal = fmtTime(fetched || new Date());
  titleEl.textContent = "LLM 用量总览 (" + fmtLocalMinute(new Date()) + ")";
  errorState = null;
  renderPlatforms(data.platforms || []);
  schedule(typeof data.interval === "number" ? data.interval : 60);
}

async function refresh() {
  if (!lastFetchedLocal && !errorState) statusEl.textContent = "加载中…";
  try {
    var r = await fetch("/api/usage");
    var data = null;
    try { data = await r.json(); } catch (_) { /* 非 JSON 响应 */ }
    if (!r.ok) throw new Error((data && data.error) || ("HTTP " + r.status));
    render(data);
  } catch (e) {
    errorState = String((e && e.message) || e);
    schedule(10);  // 10s 后重试,不清空旧卡片
  }
}

// 每秒:重算重置倒计时 + 更新状态行
function tick() {
  var now = new Date();
  var cells = platformsEl.querySelectorAll("td.cd");
  for (var i = 0; i < cells.length; i++) {
    cells[i].textContent = fmtCountdown(cells[i].dataset.reset || null, now);
  }
  var remain = Math.max(0, Math.round((nextAt - Date.now()) / 1000));
  if (errorState) {
    statusEl.textContent = "获取失败:" + errorState + " · " + remain + "s 后重试";
    statusEl.className = "status err";
  } else if (lastFetchedLocal) {
    statusEl.textContent = "上次获取 " + lastFetchedLocal + " · 下次刷新 " + remain + "s";
    statusEl.className = "status";
  }
}

refresh();
setInterval(tick, 1000);
</script>
</body>
</html>
