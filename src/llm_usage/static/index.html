<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>LLM 用量总览</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20x='1.5'%20y='12'%20width='3'%20height='6'%20rx='1'%20fill='%2356b6c2'/%3E%3Crect%20x='6'%20y='9'%20width='3'%20height='9'%20rx='1'%20fill='%23ffb300'/%3E%3Crect%20x='10.5'%20y='6'%20width='3'%20height='12'%20rx='1'%20fill='%234caf50'/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#16181d">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #16181d;
    --fg: #d7dae0;
    --dim: #7a7f8a;
    --sep: #3a3f4a;
    --green: #4caf50;
    --yellow: #ffb300;
    --red: #ef5350;
    --cyan: #56b6c2;
    --track: #2c313c;
    --surface: #1c2027;
    --surface-raised: #222730;
    --hover: rgba(255, 255, 255, 0.035);
    --glow: #1b2230;
    --accent-soft: rgba(86, 182, 194, 0.12);
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.26);
  }
  /* 浅色主题:覆盖同名变量,强调色取深一档以保证白底对比度 */
  html[data-theme="light"] {
    --bg: #f5f6f8;
    --fg: #24292f;
    --dim: #6e7781;
    --sep: #d0d7de;
    --green: #1a7f37;
    --yellow: #9a6700;
    --red: #cf222e;
    --cyan: #0a7ea4;
    --track: #e2e5ea;
    --surface: #ffffff;
    --surface-raised: #f8fafc;
    --hover: rgba(0, 0, 0, 0.03);
    --glow: #e9edf3;
    --accent-soft: rgba(10, 126, 164, 0.1);
    --shadow: 0 6px 24px rgba(27, 31, 36, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: max(clamp(8px, 2.2vh, 20px), env(safe-area-inset-top))
             max(clamp(8px, 2vw, 20px), env(safe-area-inset-right))
             max(clamp(8px, 2.2vh, 20px), env(safe-area-inset-bottom))
             max(clamp(8px, 2vw, 20px), env(safe-area-inset-left));
    min-height: 100dvh;
    background:
      radial-gradient(900px 460px at 82% -10%, var(--glow), transparent 68%),
      var(--bg);
    background-attachment: fixed;
    color: var(--fg);
    font-family: "Sarasa Mono SC", "Noto Sans Mono CJK SC", "PingFang SC",
                 "Microsoft YaHei", Consolas, "Courier New", monospace;
    font-size: 14px;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  #app { width: 100%; max-width: 1500px; margin: 0 auto; }
  .card {
    background: var(--surface);
    border: 1px solid var(--sep);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: clamp(9px, 1.6vh, 14px) clamp(12px, 1.5vw, 18px)
             clamp(7px, 1.35vh, 12px);
    transition: background-color 0.25s ease, border-color 0.25s ease,
                transform 0.2s ease, box-shadow 0.2s ease;
  }
  .overview-card {
    padding-block: clamp(9px, 1.4vh, 14px);
    background:
      linear-gradient(110deg, var(--accent-soft), transparent 42%),
      var(--surface);
  }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  /* 平台卡片网格:中等 PWA 窗口也能容纳两列,卡片内部再独立响应宽度。 */
  #platforms {
    margin-top: clamp(8px, 1.4vh, 12px);
    display: grid;
    align-items: stretch;
    gap: clamp(8px, 1.3vmin, 12px);
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  }
  .platform {
    container-type: inline-size;
    height: 100%;
    min-width: 0;
    overflow: visible;
  }
  @media (hover: hover) {
    .platform:hover {
      border-color: color-mix(in srgb, var(--sep) 45%, var(--cyan));
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.2);
      transform: translateY(-1px);
    }
  }
  .platform-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: clamp(5px, 0.9vh, 8px);
    margin-bottom: 1px;
    border-bottom: 1px solid var(--sep);
  }
  .platform-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    color: var(--fg);
    font-weight: 700;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .platform-state {
    display: inline-flex;
    flex: none;
    align-items: center;
    gap: 5px;
    padding: 2px 7px;
    border: 1px solid currentColor;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.35;
  }
  .platform-state::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
  }
  .entry-toggle, .rotation-indicator {
    display: inline-flex;
    flex: none;
    align-items: center;
    justify-content: center;
    min-height: 22px;
    padding: 1px 7px;
    color: var(--cyan);
    background: transparent;
    border: 1px solid color-mix(in srgb, var(--cyan) 55%, var(--sep));
    border-radius: 999px;
    font: inherit;
    font-size: 11px;
    line-height: 1.2;
    cursor: pointer;
  }
  .entry-toggle:hover, .rotation-indicator:hover {
    color: var(--fg);
    background: var(--accent-soft);
  }
  .entry-toggle:focus-visible, .rotation-indicator:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
  }
  /* 切换按钮(自动轮播与手动翻页共用)在位置文字后追加「›」;无障碍名称取 aria-label */
  .rotation-indicator::after {
    content: "\203A";
    margin-left: 4px;
    font-size: 13px;
    line-height: 1;
  }
  .rotation-indicator[hidden] { display: none; }
  .platform.is-expanded {
    grid-column: 1 / -1;
    height: auto;
  }
  .expanded-entry-grid {
    display: grid;
    grid-template-columns: repeat(var(--expanded-columns, 1), minmax(0, 1fr));
    gap: 10px;
    width: 100%;
    margin-top: 2px;
  }
  .expanded-entry-column {
    container-type: inline-size;
    min-width: 0;
    padding: 2px 9px 4px;
    background: var(--surface-raised);
    border: 1px solid color-mix(in srgb, var(--sep) 72%, transparent);
    border-radius: 10px;
  }
  .platform > table[hidden] { display: none; }
  .platform-err, .platform-empty { padding: 2px 0; }
  .platform-err { color: var(--red); }
  .platform-warning {
    padding: 4px 0 clamp(4px, 0.8vh, 8px);
    color: var(--yellow);
  }
  .pill-btn {
    flex: none;
    min-height: 34px;
    padding: 5px 16px;
    font: inherit;
    font-size: 13px;
    color: var(--dim);
    background: var(--surface-raised);
    border: 1px solid var(--sep);
    border-radius: 999px;
    cursor: pointer;
    text-decoration: none;
    transition: color 0.2s ease, border-color 0.2s ease,
                background-color 0.2s ease, box-shadow 0.2s ease;
  }
  .pill-btn:hover {
    color: var(--fg);
    border-color: var(--dim);
    background: var(--hover);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  }
  .pill-btn:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
  }
  #interval-select {
    flex: none;
    min-height: 34px;
    padding: 5px 12px;
    font: inherit;
    font-size: 13px;
    color: var(--dim);
    background: var(--surface-raised);
    border: 1px solid var(--sep);
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
  }
  #interval-select:hover { color: var(--fg); border-color: var(--dim); }
  #interval-select:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .nav-menu { position: relative; }
  .more-btn {
    width: 34px;
    padding-inline: 0;
    color: var(--fg);
    font-size: 17px;
    line-height: 1;
  }
  #more-dropdown {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    z-index: 50;
    min-width: 150px;
    background: var(--surface);
    border: 1px solid var(--sep);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 6px;
  }
  #more-dropdown button, #more-dropdown .dropdown-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 8px 14px;
    font: inherit;
    font-size: 13px;
    color: var(--fg);
    background: transparent;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
  }
  #more-dropdown .menu-separator {
    height: 1px;
    margin: 5px 8px;
    background: var(--sep);
  }
  #more-dropdown .danger-item { color: var(--red); }
  #more-dropdown button:hover, #more-dropdown .dropdown-item:hover {
    background-color: var(--hover);
  }
  #more-dropdown button:focus-visible, #more-dropdown .dropdown-item:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: -2px;
  }
  #more-dropdown [hidden] { display: none; }
  #theme-toggle:disabled, .pill-btn:disabled, #interval-select:disabled {
    opacity: 0.5;
    cursor: default;
    pointer-events: none;
  }
  .head-nav { display: flex; gap: 6px; flex: none; align-items: center; }
  .title {
    font-weight: bold;
    font-size: 17px;
    letter-spacing: 0.02em;
    margin-bottom: 6px;
    background: linear-gradient(90deg, var(--cyan), var(--green));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .status {
    display: flex;
    align-items: center;
    color: var(--dim);
    font-size: 13px;
    min-height: 1.2em;
    font-variant-numeric: tabular-nums;
  }
  .status::before {
    content: "";
    flex: none;
    width: 6px;
    height: 6px;
    margin-right: 6px;
    border-radius: 50%;
    background: var(--green);
  }
  .status.err { color: var(--red); }
  .status.err::before { background: var(--red); }
  table {
    width: 100%;
    border-collapse: collapse;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  th {
    text-align: left;
    color: var(--dim);
    font-weight: normal;
    font-size: 12px;
    padding: clamp(3px, 0.7vh, 6px) 14px clamp(2px, 0.5vh, 4px) 0;
    border-bottom: 1px solid var(--sep);
  }
  td {
    padding: clamp(2px, 0.45vh, 3px) 14px clamp(1px, 0.45vh, 3px) 0;
    vertical-align: middle;
  }
  th:last-child, td:last-child { padding-right: 0; }
  th.num, td.num { text-align: right; }
  tbody tr:not(.bar-row):hover td { background: var(--hover); }
  .bold { font-weight: bold; }
  .dim { color: var(--dim); }
  .plan-head td {
    padding-top: clamp(5px, 0.9vh, 8px);
    border-top: 1px solid color-mix(in srgb, var(--sep) 72%, transparent);
    font-weight: 600;
  }
  tbody tr.plan-head:first-child td { border-top: none; }
  .summary-row td {
    padding-top: clamp(4px, 0.7vh, 7px);
    border-top: 1px dashed var(--sep);
    font-weight: 700;
  }
  .summary-bar td { padding-bottom: 0; }
  .red { color: var(--red); }
  .yellow { color: var(--yellow); }
  .ok { color: var(--green); font-weight: 600; }
  .bar-row td { padding-top: 0; padding-bottom: clamp(2px, 0.65vh, 5px); }
  .bar-wrap { display: flex; align-items: center; gap: 10px; }
  .bar-track {
    flex: 1;
    height: clamp(5px, 1vh, 10px);
    background: var(--track);
    border-radius: 999px;
    overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.18);
  }
  .bar-fill {
    height: 100%;
    border-radius: 999px;
    transition: width 0.6s ease;
  }
  .bar-fill.green  { background: linear-gradient(180deg, color-mix(in srgb, var(--green) 78%, white), var(--green)); }
  .bar-fill.yellow { background: linear-gradient(180deg, color-mix(in srgb, var(--yellow) 78%, white), var(--yellow)); }
  .bar-fill.red    { background: linear-gradient(180deg, color-mix(in srgb, var(--red) 78%, white), var(--red)); }
  .bar-label { min-width: 4em; text-align: right; font-weight: 700; }
  .bar-label.green-text  { color: var(--green); }
  .bar-label.yellow-text { color: var(--yellow); }
  .bar-label.red-text    { color: var(--red); }
  @keyframes row-in {
    from { transform: translateY(2px); }
    to { transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .status::before { animation: pulse 2s ease-in-out infinite; }
    .status.err::before { animation: none; }
    .rotating-slot { animation: row-in 0.22s ease-out; }
  }
  /* Sub2API 分组各 Key 用量悬浮明细 */
  .breakdown-row { position: relative; }
  .breakdown-row .breakdown-hint {
    text-decoration: underline dotted;
    cursor: pointer;
  }
  .key-popover {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 50;
    min-width: 220px;
    max-width: min(90vw, 320px);
    background: var(--surface);
    border: 1px solid var(--sep);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 8px 12px;
  }
  .key-pop-title {
    font-size: 12px;
    color: var(--dim);
    margin-bottom: 6px;
  }
  .key-pop-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 2px 0;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .key-pop-row .ok { color: var(--green); }
  .key-pop-row .err { color: var(--red); }
  .compact-value, .compact-label { display: none; }

  /* 卡片级响应式布局:网格出现多列时,每张窄卡仍保持完整的核心指标。 */
  @container (max-width: 520px) {
    .platform-head { gap: 6px; padding-bottom: 6px; }
    table { table-layout: fixed; }
    th { padding-right: 5px; }
    td { padding-right: 5px; }
    .window-col { width: 24%; }
    .usage-col { width: 31%; }
    .remaining-col { width: 21%; }
    .countdown-col { width: 24%; }
    .limit-col, .reset-col { display: none; }
    .wide-value, .wide-label { display: none; }
    .compact-value, .compact-label { display: inline; }
    .entry-label {
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .usage-cell, .remaining-cell, .countdown-cell {
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bar-row td { padding-right: 0; }
    .bar-label { min-width: 3.2em; }
  }

  @media (max-width: 900px) {
    #platforms {
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
    }
  }

  @media (max-width: 560px) {
    .overview-card { border-radius: 12px; }
    .card-head { gap: 8px; }
    .head-nav { gap: 4px; }
    .pill-btn, #interval-select { min-height: 30px; }
    .pill-btn { padding-inline: 9px; }
    #interval-select { max-width: 74px; padding-inline: 6px; }
    #platforms { margin-top: 8px; gap: 8px; }
  }

  @media (max-width: 390px) {
    .refresh-label { display: none; }
    #refresh-now { width: 31px; padding-inline: 0; font-size: 16px; }
    .overview-card .title { max-width: 135px; white-space: nowrap; }
  }

  /* 高度不足时利用横向空间增加卡片列数，并压平顶栏；正文大小保持不变。 */
  @media (max-height: 700px) and (min-width: 901px) {
    #platforms {
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
    }
  }

  @media (max-height: 700px) and (min-width: 561px) {
    .overview-card .card-head > :first-child {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .overview-card .title { margin-bottom: 0; white-space: nowrap; }
    .overview-card .status { white-space: nowrap; }
  }

  @media (max-height: 520px) {
    .bar-track { height: 4px; }
    .platform-head { margin-bottom: 0; }
  }

  /* 自动试排选中的密度档位；只压缩布局，不缩小正文。 */
  html[data-density="compact"] #platforms {
    gap: 8px;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
  }
  html[data-density="ultra"] #platforms {
    gap: 7px;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
  }
  html[data-density="compact"] .platform {
    padding-block: 10px 8px;
  }
  html[data-density="ultra"] .platform {
    padding-block: 8px 6px;
  }
  html[data-density="compact"] .platform-head,
  html[data-density="ultra"] .platform-head {
    margin-bottom: 0;
    padding-bottom: 5px;
  }
  html[data-density="compact"] .bar-track { height: 6px; }
  html[data-density="ultra"] .bar-track { height: 4px; }
  html[data-density="ultra"] .bar-row td { padding-bottom: 1px; }

  @media (min-width: 561px) {
    html[data-density="compact"] .overview-card .card-head > :first-child,
    html[data-density="ultra"] .overview-card .card-head > :first-child {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    html[data-density="compact"] .overview-card .title,
    html[data-density="ultra"] .overview-card .title {
      margin-bottom: 0;
      white-space: nowrap;
    }
    html[data-density="compact"] .overview-card .status,
    html[data-density="ultra"] .overview-card .status { white-space: nowrap; }
  }
</style>
<script>
// 首屏前确定主题,避免闪烁:localStorage 优先,其次系统偏好,默认深色。
(function () {
  var t = null;
  try { t = localStorage.getItem("llm-usage-theme"); } catch (_) {}
  if (t !== "light" && t !== "dark") {
    t = (window.matchMedia &&
         matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
  }
  document.documentElement.dataset.theme = t;
})();
</script>
</head>
<body>
<div id="app">
  <div class="card overview-card">
    <div class="card-head">
      <div>
        <div id="title" class="title">LLM 用量总览</div>
        <div id="status" class="status" aria-live="polite">加载中…</div>
      </div>
      <div class="head-nav">
        <button id="refresh-now" class="pill-btn" type="button" title="忽略缓存，立即重新获取各平台用量" aria-label="马上刷新">↻ <span class="refresh-label">刷新</span></button>
        <select id="interval-select" title="自动刷新间隔" aria-label="自动刷新间隔"></select>
        <div class="nav-menu">
          <button id="more-menu-btn" class="pill-btn more-btn" type="button" title="更多选项" aria-label="更多选项" aria-controls="more-dropdown" aria-expanded="false">⋯</button>
          <div id="more-dropdown" class="dropdown" role="menu" hidden>
            <button id="theme-toggle" type="button" title="切换浅色/深色主题">浅色</button>
            <a id="nav-users" class="dropdown-item" href="/users" hidden>用户管理</a>
            <a id="nav-config" class="dropdown-item" href="/config" hidden>供应商配置</a>
            <div class="menu-separator" aria-hidden="true"></div>
            <button id="logout" class="danger-item" type="button">退出登录</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="platforms"></div>
</div>
<!-- 平台卡片内的 entry 表格骨架;每个平台卡片克隆一份。 -->
<template id="entry-table">
  <table>
    <thead>
      <tr>
        <th class="window-col">窗口</th>
        <th class="num usage-col"><span class="wide-label">已用</span><span class="compact-label">已用/限额</span></th>
        <th class="num limit-col">限额</th><th class="num remaining-col">剩余</th>
        <th class="reset-col">重置时间</th><th class="num countdown-col">重置倒计时</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</template>
<script>
"use strict";

var platformsEl = document.getElementById("platforms");
var entryTableTpl = document.getElementById("entry-table");
var statusEl = document.getElementById("status");

var lastFetchedLocal = null;  // 上次成功获取的本地时间 "HH:MM:SS"
var nextAt = 0;               // 下一次轮询的时间戳(ms)
var pollTimer = 0;
var errorState = null;        // 拉取失败时的错误信息(保留旧卡片)
var usageRequestId = 0;       // 仅最新请求可更新数据、错误、计时和等待状态
var refreshing = false;      // tick() 保持等待提示,不显示旧轮询倒计时

// 展开状态跨数据刷新和页面刷新保留，但只限当前标签页会话。

} catch (_) { /* 隐私模式或无效缓存时使用空状态 */ }

function setPlatformExpanded(stateKey, expanded) {
  if (expanded) expandedPlatformKeys.add(stateKey);
  else expandedPlatformKeys.delete(stateKey);
  try {
    sessionStorage.setItem(EXPANDED_STATE_KEY, JSON.stringify(Array.from(expandedPlatformKeys)));

}

// ---- 格式化 ----
// 以下函数对应 display.py 中的实现：_fmt_value / _to_local_time / _fmt_countdown。
// 数值格式化尽量贴近 Python 的 `:g`（整数去尾，非整数保留约 6 位有效数字）。

function p2(n) { return String(n).padStart(2, "0"); }

// Python 的 `:g`:整数去小数,否则约 6 位有效数字。
function fmtG(v) {
  if (Number.isInteger(v)) return String(v);
  return String(parseFloat(Number(v).toPrecision(6)));
}

// _fmt_value
function fmtValue(v, unit) {
  if (v === null || v === undefined) return "-";
  var num = fmtG(v);
  if (unit === "$") return "$" + num;
  if (unit === "%") return num + "%";
  if (unit === "tokens") return num + " tokens";
  return (num + " " + (unit || "")).trim();
}

// 窄卡片内的数字缩写，完整值仍保留在 title/aria-label 中。
function fmtCompactNumber(v) {
  var n = Number(v);
  if (!Number.isFinite(n)) return String(v);
  var abs = Math.abs(n);
  var scale = 1;
  var suffix = "";
  if (abs >= 1000000000) { scale = 1000000000; suffix = "B"; }
  else if (abs >= 1000000) { scale = 1000000; suffix = "M"; }
  else if (abs >= 1000) { scale = 1000; suffix = "k"; }
  var scaled = n / scale;
  var digits = Math.abs(scaled) >= 100 ? 0 : Math.abs(scaled) >= 10 ? 1 : 2;
  return String(parseFloat(scaled.toFixed(digits))) + suffix;
}

function fmtCompactValue(v, unit) {
  if (v === null || v === undefined) return "-";
  var num = fmtCompactNumber(v);
  if (unit === "$") return "$" + num;
  if (unit === "%") return num + "%";
  // tokens 等长单位在紧凑表头中省略，避免数字被挤压；完整单位可悬停查看。
  if (unit && unit !== "tokens" && unit.length <= 3) return num + unit;
  return num;
}

// ISO 解析:naive(无 Z 且无 ±HH:MM 偏移)视为 UTC —— 对应 _to_local_time 的规则。
function parseReset(s) {
  if (!s) return null;
  var v = String(s).trim();
  if (!/[Zz]$/.test(v) && !/[+-]\d{2}:?\d{2}$/.test(v)) v += "Z";
  var d = new Date(v);
  return isNaN(d.getTime()) ? null : d;
}

// 本地时间 YYYY-MM-DD HH:MM:SS(手动补零)
function fmtLocal(d) {
  return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()) +
         " " + p2(d.getHours()) + ":" + p2(d.getMinutes()) + ":" + p2(d.getSeconds());
}

function fmtTime(d) {
  return p2(d.getHours()) + ":" + p2(d.getMinutes()) + ":" + p2(d.getSeconds());
}

// 重置时间列:_to_local_time —— 空 → "-",无法解析 → 原样显示
function fmtResetCell(s) {
  if (!s) return "-";
  var d = parseReset(s);
  if (!d) return s;
  return fmtLocal(d);
}

// _fmt_countdown(逐字一致);kind="expires" 表示该时间是套餐到期而非窗口重置
function fmtCountdown(resetAt, now, kind) {
  if (!resetAt) return "-";
  var d = parseReset(resetAt);
  if (!d) return "-";
  var secs = Math.floor((d.getTime() - now.getTime()) / 1000);
  if (secs <= 0) return kind === "expires" ? "已到期" : "已重置";
  var days = Math.floor(secs / 86400);
  var rem = secs % 86400;
  var hours = Math.floor(rem / 3600);
  var minutes = Math.floor((rem % 3600) / 60);
  if (days > 0) return days + "天" + hours + "小时";
  if (hours > 0) return hours + "小时" + minutes + "分";
  return minutes + "分";
}

// 颜色阈值同 CLI:>=95 红,>=80 黄,否则绿
function pctColor(percent) {
  if (percent >= 95) return "red";
  if (percent >= 80) return "yellow";
  return "green";
}

// ---- DOM 构建 ----
// 每个平台一张卡片:卡片头 = 平台名 + 状态徽章(OK/提示/错误),条数超限时附带
// 切换按钮(自动轮播指示器或手动翻页,见「收起视图的手动切换」)/「+N」展开按钮;
// 卡片体 = entry 表格(每个 entry 占一个数据行 +
// 一个通栏进度条行)。周期窗口平台按密度档折叠(compact 档保留 5小时/每周);
// 同计费单位平台改为轮播展示,尾部追加「全部合计」汇总行。
// error 平台卡片体显示错误信息;空 entries 平台显示 "无数据"。

function el(tag, cls) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

function td(text, cls, colspan) {
  var cell = el("td", cls);
  cell.textContent = text;
  if (colspan) cell.colSpan = colspan;
  return cell;
}

function responsiveValueCell(wide, compact, cls, accessibleText) {
  var cell = td("", cls);
  var wideSpan = el("span", "wide-value");
  var compactSpan = el("span", "compact-value");
  wideSpan.textContent = wide;
  compactSpan.textContent = compact;
  wideSpan.setAttribute("aria-hidden", "true");
  compactSpan.setAttribute("aria-hidden", "true");
  cell.setAttribute("aria-label", accessibleText || wide);
  cell.title = accessibleText || wide;
  cell.appendChild(wideSpan);
  cell.appendChild(compactSpan);
  return cell;
}

function periodRank(label) {
  var text = String(label || "").trim();
  var duration = text.match(/^(\d+(?:\.\d+)?)(分钟|小时|天)$/);
  if (duration) {
    var scale = duration[2] === "分钟" ? 1 : duration[2] === "小时" ? 60 : 1440;
    return Number(duration[1]) * scale;
  }
  return {
    "每小时": 60,
    "每日": 1440,
    "每天": 1440,
    "每周": 10080,
    "每月": 43200,
    "每季": 129600,
    "每季度": 129600,
    "每年": 525600
  }[text] || null;
}

function hasPeriodWindows(entries) {
  return entries.length > 0 && entries.every(function (entry) {
    return periodRank(entry.label) !== null;
  });
}

function hasSingleUnit(entries) {
  return entries.length > 0 && entries.every(function (entry) {
    return entry.unit === entries[0].unit;
  });
}

function firstEntryWithRank(entries, wantedRank) {
  for (var i = 0; i < entries.length; i++) {
    if (periodRank(entries[i].label) === wantedRank) return entries[i];
  }
  return null;
}

function collapsedPeriodEntries(entries, mode, periodWindows) {
  if (mode === "normal") return entries.slice(0, 3);
  if (!periodWindows) return entries.slice(0, mode === "compact" ? 2 : 1);
  var fiveHour = firstEntryWithRank(entries, 5 * 60) || entries[0] || null;
  if (mode === "ultra") return fiveHour ? [fiveHour] : [];
  var weekly = firstEntryWithRank(entries, 7 * 24 * 60);
  var selected = fiveHour ? [fiveHour] : [];
  if (weekly && weekly !== fiveHour) selected.push(weekly);
  return selected;
}

function cleanTotal(value) {
  return Number(Number(value).toPrecision(12));
}

// 余额的 limit 是用户设置的显示上限,percent 为相对该上限的用量占比;已用金额保持未知。
function isBalanceOnly(entry) {
  return (entry.label === "余额用量" || entry.label === "余额" || entry.balance_only === true) &&
    entry.used === 0 &&
    entry.remaining !== null && entry.remaining !== undefined;
}

// 独立分组必须使用同一计费单位；限额不完整时只汇总已用，不虚构总进度。
function totalEntry(entries) {
  var unit = entries[0].unit;
  var sameUnit = entries.every(function (entry) { return entry.unit === unit; });
  var balanceOnly = sameUnit && entries.every(isBalanceOnly);
  var used = sameUnit ? cleanTotal(entries.reduce(function (sum, entry) {
    return sum + (Number.isFinite(Number(entry.used)) ? Number(entry.used) : 0);
  }, 0)) : 0;
  var hasCompleteLimit = sameUnit && entries.every(function (entry) {
    return entry.limit !== null && entry.limit !== undefined &&
           Number.isFinite(Number(entry.limit));
  });
  var limit = hasCompleteLimit ? cleanTotal(entries.reduce(function (sum, entry) {
    return sum + Number(entry.limit);
  }, 0)) : null;
  var remaining = balanceOnly ? cleanTotal(entries.reduce(function (sum, entry) {
    return sum + Number(entry.remaining);
  }, 0)) : limit === null ? null : cleanTotal(Math.max(limit - used, 0));
  var percent = limit === null || limit === 0
    ? null : Math.round(Math.max(Math.min(
      (balanceOnly ? limit - remaining : used) / limit * 100, 100
    ), 0) * 10) / 10;
  // 继承一致的重置时间与语义:时间或 reset_kind 不一致时都不继承,
  // 避免到期时间被当成窗口重置(「已重置」)。
  var resets = entries.map(function (entry) { return entry.reset_at || null; });
  var kinds = entries.map(function (entry) { return entry.reset_kind || null; });
  var sameReset = resets.every(function (value) { return value === resets[0]; }) &&
    kinds.every(function (value) { return value === kinds[0]; });
  return {
    label: "全部合计",
    balance_only: balanceOnly,
    used: used,
    limit: limit,
    remaining: remaining,
    percent: percent,
    reset_at: sameReset ? resets[0] : null,
    reset_kind: sameReset ? kinds[0] : null,
    unit: sameUnit ? unit : "",
    plan: null,
    key_breakdown: null
  };
}

// ---- Sub2API 分组各 Key 用量明细弹层 ----
// 弹层节点挂在分组数据行 tr(.breakdown-row) 内,以行为定位祖先;
// renderPlatforms 每次重建 #platforms,旧节点连监听一起销毁,无泄漏。
// 每行显示 key_breakdown 项:配置了名称(name)显示名称,否则回退 #N;
// 成功(ok)绿色显示用量,失败红色显示 error 文案。

// 关闭页面上所有已打开的弹层(同一时刻只开一个)。
function closeKeyPopovers() {
  var open = platformsEl.querySelectorAll(".key-popover");
  for (var i = 0; i < open.length; i++) open[i].remove();
}

// 构建弹层:标题 = 组名 + 「各 Key 用量」;逐 Key 行 = #N + 用量/错误。
function buildKeyPopover(entry) {
  var pop = el("div", "key-popover");
  // 点击弹层内部不冒泡,避免触发行 toggle 误关
  pop.addEventListener("click", function (ev) { ev.stopPropagation(); });
  var title = el("div", "key-pop-title");
  title.textContent = entry.label + " · 各 Key 用量";
  pop.appendChild(title);
  entry.key_breakdown.forEach(function (item) {
    var row = el("div", "key-pop-row");
    var num = el("span");
    // 配置了 Key 名称 → 显示名称;否则回退 #N
    num.textContent = (item.name && String(item.name).trim())
      ? String(item.name).trim()
      : "#" + (item.number === undefined ? "-" : item.number);
    var val = el("span");
    if (item.ok === true) {
      val.className = "ok";
      val.textContent = fmtValue(item.used, entry.unit);
    } else {
      val.className = "err";
      val.textContent = item.error || "-";
    }
    row.appendChild(num);
    row.appendChild(val);
    pop.appendChild(row);
  });
  return pop;
}

function dataRow(entry) {
  var tr = el("tr");
  var used, limit, remaining;
  // 特殊行规则(同 _make_data_line)
  if (isBalanceOnly(entry)) {
    used = "-";
    limit = entry.limit === null ? "-" : fmtValue(entry.limit, entry.unit);
    remaining = fmtValue(entry.remaining, entry.unit);
  } else if (entry.limit === null && entry.used === 0 && entry.percent !== null) {
    used = limit = remaining = "-";
  } else {
    used = fmtValue(entry.used, entry.unit);
    limit = entry.limit === null ? "∞" : fmtValue(entry.limit, entry.unit);
    remaining = entry.remaining === null ? "-" : fmtValue(entry.remaining, entry.unit);
  }
  var compactUsed = used === "-" ? "-" : fmtCompactValue(entry.used, entry.unit);
  var compactLimit = limit === "-"
    ? "-" : entry.limit === null ? "∞" : fmtCompactValue(entry.limit, entry.unit);
  var compactRemaining = remaining === "-"
    ? "-" : fmtCompactValue(entry.remaining, entry.unit);
  var label = entry.label === "余额" ? "余额用量" : entry.label;
  var labelCell = td(label, "entry-label");
  labelCell.title = label;
  // 多 Key 组(与 CLI render_key_breakdown 约定一致):行可点击弹出各 Key 明细
  if (Array.isArray(entry.key_breakdown) && entry.key_breakdown.length >= 2) {
    tr.className = "breakdown-row";
    labelCell.classList.add("breakdown-hint");
    labelCell.title = "点击查看各 Key 用量";
    tr.addEventListener("click", function (ev) {
      ev.stopPropagation();  // 阻止冒泡到 document 的关闭监听
      if (tr.querySelector(".key-popover")) {
        closeKeyPopovers();
      } else {
        closeKeyPopovers();
        tr.appendChild(buildKeyPopover(entry));
      }
    });
  }
  tr.appendChild(labelCell);
  tr.appendChild(responsiveValueCell(
    used,
    compactUsed + "/" + compactLimit,
    "num usage-cell",
    "已用 " + used + (isBalanceOnly(entry) && entry.limit !== null ? "，最大余额 " : "，限额 ") + limit
  ));
  var limitCell = td(limit, "num limit-col");
  if (isBalanceOnly(entry) && entry.limit !== null) limitCell.title = "用户设置的最大余额";
  tr.appendChild(limitCell);
  tr.appendChild(responsiveValueCell(
    remaining, compactRemaining, "num remaining-cell", "剩余 " + remaining
  ));
  var reset = td(fmtResetCell(entry.reset_at), "dim reset-col");
  reset.title = fmtResetCell(entry.reset_at);
  tr.appendChild(reset);
  var cd = td(fmtCountdown(entry.reset_at, new Date(), entry.reset_kind), "num dim cd countdown-cell");
  cd.dataset.reset = entry.reset_at || "";
  cd.dataset.kind = entry.reset_kind || "";
  cd.title = entry.reset_at
    ? (entry.reset_kind === "expires" ? "到期时间 " : "重置时间 ") + fmtResetCell(entry.reset_at)
    : "无重置时间";
  tr.appendChild(cd);
  return tr;
}

function barRow(percent, balanceOnly) {
  var tr = el("tr", "bar-row");
  var cell = td("", "", 6);
  if (percent !== null && percent !== undefined) {
    var color = pctColor(percent);
    var wrap = el("div", "bar-wrap");
    var track = el("div", "bar-track");
    var fill = el("div", "bar-fill " + color);
    fill.style.width = Math.min(Math.max(percent, 0), 100) + "%";
    track.appendChild(fill);
    var label = el("span", "bar-label " + color + "-text");
    label.textContent = Math.round(percent) + "%";
    if (balanceOnly) wrap.title = "用量占比 = (最大余额 - 当前余额) ÷ 最大余额";
    wrap.appendChild(track);
    wrap.appendChild(label);
    cell.appendChild(wrap);
  }
  tr.appendChild(cell);
  return tr;
}

function appendEntryRows(body, entry, rowClass) {
  var data = dataRow(entry);
  var bar = barRow(entry.percent, isBalanceOnly(entry));
  if (rowClass) {
    data.classList.add(rowClass);
    bar.classList.add(rowClass);
  }
  body.appendChild(data);
  body.appendChild(bar);
}

function appendEntries(body, entries, rowClass) {
  var prevPlan = null;
  entries.forEach(function (entry) {
    if (entry.plan && entry.plan !== prevPlan) {
      var planRow = el("tr", "plan-head");
      planRow.appendChild(td(entry.plan, "dim", 6));
      body.appendChild(planRow);
    }
    appendEntryRows(body, entry, rowClass);
    prevPlan = entry.plan;
  });
}

function renderRotatingRows(body, entries, offset, indicator, slotCount, periodTotals) {
  body.textContent = "";
  var shown = [];
  var selected = [];
  for (var i = 0; i < slotCount; i++) {
    var index = (offset + i) % entries.length;
    shown.push(index);
    selected.push(entries[index]);
  }
  var accountRotation = Array.isArray(periodTotals);
  if (accountRotation) {
    appendEntries(body, selected, "rotating-slot");
    if (periodTotals.length > 0) appendTotalBlock(body, periodTotals.slice(0, 1));
  } else {
    selected.forEach(function (entry) { appendEntryRows(body, entry, "rotating-slot"); });
    appendTotalRows(body, entries);
  }
  if (indicator && shown.length > 0) {
    indicator.textContent = shown.map(function (index) { return index + 1; }).join("–") +
                            "/" + entries.length;
    indicator.title = "正在轮播第 " + shown.map(function (index) {
      return index + 1;
    }).join("、") + (accountRotation ? " 个账号，共 " : " 条，共 ") + entries.length +
                      (accountRotation ? " 个账号；点击切换" : " 条；点击切换");
  }
}

// 展开网格的分列规则:以 plan(账户/套餐)为最小单位,同一账户的
// 每日/每周/每月行绝不跨列;列数不超过 requestedColumns。
function planColumnGroups(entries, requestedColumns) {
  var groups = [];
  entries.forEach(function (entry) {
    var plan = entry.plan === undefined ? null : entry.plan;
    if (groups.length === 0 || groups[groups.length - 1].plan !== plan) {
      groups.push({ plan: plan, entries: [] });
    }
    groups[groups.length - 1].entries.push(entry);
  });
  var maxColumns = Math.max(1, Math.min(requestedColumns || 1, Math.max(entries.length, 1)));
  var target = Math.ceil(entries.length / maxColumns);
  var columns = [[]];
  groups.forEach(function (group) {
    var current = columns[columns.length - 1];
    var count = 0;
    current.forEach(function (g) { count += g.entries.length; });
    // 当前列够满且还有列可开 → 整组换列;宁可列数少也不拆账户
    if (current.length > 0 && count >= target && columns.length < maxColumns) {
      columns.push([]);
      current = columns[columns.length - 1];
    }
    current.push(group);
  });
  return columns;
}

// 卡片里的具名账号数(plan 去重;null 不计),用于多账号口径判断。
function namedPlanCount(entries) {
  var plans = [];
  entries.forEach(function (e) {
    if (e.plan && plans.indexOf(e.plan) < 0) plans.push(e.plan);
  });
  return plans.length;
}

// 空间不足(compact/ultra)展开时的口径:每个账号只留最短窗口一条(网关=每日)。
// 调用方只对多账号周期卡片启用;无 plan 时全部条目视作一组(取最短窗口一条)。
function shortestWindowEntries(entries) {
  var plans = [];
  entries.forEach(function (e) {
    var plan = e.plan === undefined ? null : e.plan;
    if (plans.indexOf(plan) < 0) plans.push(plan);
  });
  var picked = [];
  plans.forEach(function (name) {
    var best = null;
    entries.forEach(function (e) {
      var plan = e.plan === undefined ? null : e.plan;
      if (plan !== name) return;
      var rank = periodRank(e.label);
      if (rank === null) return;
      if (!best || rank < periodRank(best.label)) best = e;
    });
    if (best) picked.push(best);
  });
  return picked;
}

// 多账号卡片的分窗口合计:每日/每周/每月各一行,只汇总同一窗口的跨账号条目。
// 该窗口必须同单位且可加总(百分比行、缺账号的窗口不出合计),避免出现虚假的「合计 0」。
function windowTotals(entries) {
  if (namedPlanCount(entries) < 2 || !hasPeriodWindows(entries)) return [];
  var windows = [];
  entries.forEach(function (e) {
    if (periodRank(e.label) !== null && windows.indexOf(e.label) < 0) windows.push(e.label);
  });
  windows.sort(function (a, b) { return periodRank(a) - periodRank(b); });
  var totals = [];
  windows.forEach(function (label) {
    var basis = entries.filter(function (e) { return e.label === label; });
    if (basis.length < 2) return;
    var unit = basis[0].unit;
    if (!unit || unit === "%") return;
    if (!basis.every(function (e) { return e.unit === unit; })) return;
    var total = totalEntry(basis);
    total.label = label;   // 行标签即窗口名;「全部合计」由块头承担
    totals.push(total);
  });
  return totals;
}

// 合计数据行(+进度条):轮播路径单独使用;周期窗口合计走 appendTotalBlock。
// rowClass 供手动切换回「合计」页时复用入场动画。
function appendSummaryRows(body, total, rowClass) {
  var totalData = dataRow(total);
  var totalBar = barRow(total.percent, isBalanceOnly(total));
  totalData.classList.add("summary-row");
  totalBar.classList.add("summary-bar");
  if (rowClass) {
    totalData.classList.add(rowClass);
    totalBar.classList.add(rowClass);
  }
  body.appendChild(totalData);
  body.appendChild(totalBar);
}

// 合计块与账号块同构:「全部合计」头行 + 各窗口数据行
function appendTotalBlock(body, totals) {
  var head = el("tr", "plan-head");
  head.appendChild(td("全部合计", "dim", 6));
  body.appendChild(head);
  totals.forEach(function (total) { appendSummaryRows(body, total); });
}

// 轮播路径的合计:单行,行标签本身就是「全部合计」
function appendTotalRows(body, entries, rowClass) {
  appendSummaryRows(body, totalEntry(entries), rowClass);
}

function buildExpandedGrid(entries, totals, requestedColumns, summaryHead) {
  var columns = planColumnGroups(entries, requestedColumns);
  if (totals && totals.length > 0) {
    columns[columns.length - 1].push({
      plan: summaryHead || null, summary: true, entries: totals
    });
  }
  var grid = el("div", "expanded-entry-grid");
  grid.style.setProperty("--expanded-columns", String(columns.length));
  columns.forEach(function (groups) {
    var column = el("div", "expanded-entry-column");
    var columnFrag = entryTableTpl.content.cloneNode(true);
    var columnBody = columnFrag.querySelector("tbody");
    groups.forEach(function (group) {
      if (group.plan) {
        var planRow = el("tr", "plan-head");
        planRow.appendChild(td(group.plan, "dim", 6));
        columnBody.appendChild(planRow);
      }
      group.entries.forEach(function (entry) {
        if (group.summary) {
          var totalData = dataRow(entry);
          var totalBar = barRow(entry.percent, isBalanceOnly(entry));
          totalData.classList.add("summary-row");
          totalBar.classList.add("summary-bar");
          columnBody.appendChild(totalData);
          columnBody.appendChild(totalBar);
        } else {
          appendEntryRows(columnBody, entry);
        }
      });
    });
    column.appendChild(columnFrag);
    grid.appendChild(column);
  });
  return grid;
}

function outerGridColumnCount() {
  var columns = getComputedStyle(platformsEl).gridTemplateColumns.trim();
  if (!columns || columns === "none") return 1;
  return columns.split(/\s+/).length;
}

// ---- 收起视图的手动切换 ----
// 收起后仍有条目未显示、又没有自动轮播的卡片,卡头给一个切换按钮:按默认视图的
// 行数分组,点一下换下一组,末组之后回到默认组。切到的位置只存在卡片闭包里,
// 卡片重建(数据刷新、调整窗口、任一卡片展开/收起)即回到默认视图。

// 卡头切换按钮:自动轮播指示器与手动翻页共用,CSS 在位置文字后追加「›」。
function switchButton() {
  var button = el("button", "rotation-indicator");
  button.type = "button";
  button.setAttribute("aria-label", "切换下一组用量");
  return button;
}

// 分页:第一页就是默认视图显示的条目(空数组 = 只显示合计行),其余条目保持
// 原顺序,每页 firstPage.length 条(至少 1 条),最后一页可能更短。
function collapsedPages(entries, firstPage) {
  var size = Math.max(firstPage.length, 1);
  var rest = entries.filter(function (entry) { return firstPage.indexOf(entry) < 0; });
  var pages = [firstPage];
  for (var i = 0; i < rest.length; i += size) pages.push(rest.slice(i, i + size));
  return pages;
}

// 按钮文字与悬停提示:「a–b/n」(单条为「a/n」);空页(只显示合计)为「合计」。
function pageLabel(pages, index) {
  var start = 0;
  var total = 0;
  pages.forEach(function (page, i) {
    if (i < index) start += page.length;
    total += page.length;
  });
  var size = pages[index].length;
  if (size === 0) return { text: "合计", title: "正在显示全部合计；点击查看第 1 条" };
  var range = size === 1 ? String(start + 1) : (start + 1) + "–" + (start + size);
  return {
    text: range + "/" + total,
    title: "正在显示第 " + range + " 条，共 " + total + " 条；点击切换"
  };
}

function platformCard(p, displayMode, stateKey) {
  var card = el("div", "card platform");
  var head = el("div", "platform-head");
  var name = el("span", "platform-name");
  name.textContent = p.display_name;
  head.appendChild(name);
  var entries = Array.isArray(p.entries) ? p.entries : [];
  var periodWindows = hasPeriodWindows(entries);
  var independentRows = hasSingleUnit(entries) && !periodWindows;
  // 合计:轮播路径沿用「全部条目」的单行合计;周期窗口的多账号卡片
  // 按窗口各出一行(每日/每周/每月),口径见 windowTotals。
  var cardTotals = independentRows ? [totalEntry(entries)] : windowTotals(entries);
  // 空间不足(compact/ultra)时,多账号卡片的展开视图也只保留每个账号的
  // 最短窗口(网关=每日),合计随之只留最短窗口一行;单账号卡片保持全量展开
  var denseExpand = !independentRows && periodWindows && displayMode !== "normal" &&
    namedPlanCount(entries) >= 2;
  var expandedEntries = denseExpand ? shortestWindowEntries(entries) : entries;
  var expandedTotals = denseExpand ? cardTotals.slice(0, 1) : cardTotals;
  var collapsedEntries = collapsedPeriodEntries(entries, displayMode, periodWindows);
  var providerType = String(p.name || "").split("#")[0];
  // Sub2API 的日/周/月属于同一账号,收起后轮播每个账号的最短窗口,
  // 不能把三个窗口当成三个账号轮播或混加为一个总量。
  var accountRotation = !p.error && periodWindows && namedPlanCount(entries) >= 2 &&
    (providerType === "sub2api" || providerType === "llm-gateway") &&
    collapsedEntries.length < entries.length;
  var rotationEntries = accountRotation ? shortestWindowEntries(entries) : entries;
  var rotationSlotCount = displayMode === "normal" ? 2 : displayMode === "compact" ? 1 : 0;
  if (accountRotation && displayMode === "ultra") rotationSlotCount = 1;
  var independentCompacts = !p.error && independentRows &&
    ((displayMode === "normal" && entries.length > 3) ||
     (displayMode === "compact" && entries.length > 1) ||
     (displayMode === "ultra" && entries.length > 0));
  var rotatingCollapses = independentCompacts || accountRotation;
  var periodicCollapses = !p.error && !rotatingCollapses &&
    collapsedEntries.length < entries.length;
  var entryToggle = null;
  var rotationIndicator = null;
  if (rotatingCollapses && rotationSlotCount > 0 && rotationEntries.length > rotationSlotCount) {
    rotationIndicator = switchButton();
    head.appendChild(rotationIndicator);
  }
  // 没有自动轮播的收起视图按默认视图的行数手动翻页(见 collapsedPages);
  // manualPages[0] 就是默认视图,pageIndex 只由切换按钮改变。
  var manualPages = null;
  if (periodicCollapses) {
    manualPages = collapsedPages(entries, collapsedEntries);
  } else if (rotatingCollapses && !rotationIndicator) {
    // 无轮播按钮的轮播类卡片:ultra 只显示合计的同单位卡片(合计 → 第 1 条 → …,
    // 每页一行),以及 normal 下恰好两个账号的 Sub2API(第一页 = 各账号最短窗口)
    manualPages = collapsedPages(entries, rotationSlotCount > 0 ? rotationEntries : []);
  }
  var pageIndex = 0;
  var pager = null;
  var syncPager = function () {
    var label = pageLabel(manualPages, pageIndex);
    pager.textContent = label.text;
    pager.title = label.title;
  };
  if (manualPages && manualPages.length > 1) {
    pager = switchButton();
    syncPager();
    head.appendChild(pager);
  }
  // 切换只重画本卡片的 tbody;绝不调用 refitLayout():它会重建全部卡片,
  // 刚切到的位置随之复位。
  var bindPager = function (isExpanded, renderPage) {
    pager.addEventListener("click", function (event) {
      event.stopPropagation();
      if (isExpanded()) return;
      pageIndex = (pageIndex + 1) % manualPages.length;
      renderPage(true);
      syncPager();
    });
  };
  if (periodicCollapses || rotatingCollapses) {
    var hiddenEntryCount = accountRotation ? expandedEntries.length - rotationSlotCount
      : entries.length - (independentCompacts ? rotationSlotCount : collapsedEntries.length);
    entryToggle = el("button", "entry-toggle");
    entryToggle.type = "button";
    entryToggle.textContent = "+" + hiddenEntryCount;
    entryToggle.title = "展开全部 " + entries.length + " 条用量";
    entryToggle.setAttribute("aria-label", entryToggle.title);
    entryToggle.setAttribute("aria-expanded", "false");
    head.appendChild(entryToggle);
  }
  var state = el(
    "span",
    "platform-state " + (p.error ? "red" : p.warning ? "yellow" : "ok")
  );
  state.textContent = p.error ? "错误" : p.warning ? "提示" : "OK";
  head.appendChild(state);
  card.appendChild(head);
  if (p.error) {
    var err = el("div", "platform-err");
    err.textContent = p.error;
    card.appendChild(err);
    return card;
  }
  if (p.warning) {
    var warning = el("div", "platform-warning");
    warning.textContent = "提示：" + p.warning;
    card.appendChild(warning);
  }
  if (entries.length === 0) {
    var empty = el("div", "platform-empty dim");
    empty.textContent = "无数据";
    card.appendChild(empty);
    return card;
  }
  var frag = entryTableTpl.content.cloneNode(true);
  var table = frag.querySelector("table");
  var body = frag.querySelector("tbody");
  var expandedGrid = null;
  var setExpandedContent = function (expanded) {
    if (expandedGrid) {
      expandedGrid.remove();
      expandedGrid = null;
    }
    var expandedColumnCount = expanded ? outerGridColumnCount() : 1;
    table.hidden = expanded;
    if (expanded) {
      expandedGrid = buildExpandedGrid(
        expandedEntries, expandedTotals, expandedColumnCount,
        independentRows ? null : "全部合计"
      );
      card.appendChild(expandedGrid);
    }
  };
  if (rotatingCollapses) {
    var rotationOffset = 0;
    var independentExpanded = expandedPlatformKeys.has(stateKey);
    var renderRotation = function () {
      renderRotatingRows(
        body, rotationEntries, rotationOffset, rotationIndicator, rotationSlotCount,
        accountRotation ? cardTotals : undefined
      );
    };
    var advanceRotation = function () {
      if (independentExpanded) return;
      closeKeyPopovers();
      rotationOffset = (rotationOffset + Math.max(rotationSlotCount, 1)) % rotationEntries.length;
      renderRotation();
    };
    // 手动翻页(manualPages 非空):第 0 页沿用原默认视图,其余页画分到的条目
    var renderManualPage = function (animate) {
      var page = manualPages[pageIndex];
      var rowClass = animate ? "rotating-slot" : undefined;
      closeKeyPopovers();
      body.textContent = "";
      if (pageIndex === 0 && rotationSlotCount > 0) {
        renderRotation();
      } else if (page.length === 0) {
        appendTotalRows(body, entries, rowClass);
      } else if (accountRotation) {
        // 账号分页保留套餐标题与固定的最短窗口合计,与轮播视图同构
        appendEntries(body, page, rowClass);
        if (cardTotals.length > 0) appendTotalBlock(body, cardTotals.slice(0, 1));
      } else {
        page.forEach(function (entry) { appendEntryRows(body, entry, rowClass); });
      }
    };
    var renderIndependentRows = function () {
      closeKeyPopovers();
      card.classList.toggle("is-expanded", independentExpanded);
      if (rotationIndicator) rotationIndicator.hidden = independentExpanded;
      if (pager) pager.hidden = independentExpanded;
      setExpandedContent(independentExpanded);
      if (independentExpanded) {
        // 完整内容由多列展开网格承载，原表保留但隐藏以便快速收起。
      } else if (manualPages) {
        renderManualPage(false);
      } else {
        renderRotation();
      }
      entryToggle.textContent = independentExpanded
        ? "收起" : "+" + (accountRotation ? expandedEntries.length - rotationSlotCount
          : entries.length - rotationSlotCount);
      entryToggle.title = independentExpanded
        ? "收起并恢复精简视图" : denseExpand ? "展开各账号用量"
          : "展开全部 " + entries.length + " 条用量";
      entryToggle.setAttribute("aria-label", entryToggle.title);
      entryToggle.setAttribute("aria-expanded", String(independentExpanded));
    };
    renderIndependentRows();
    if (rotationIndicator) {
      rotationIndicator.addEventListener("click", function (event) {
        event.stopPropagation();
        advanceRotation();
      });
    }
    if (pager) bindPager(function () { return independentExpanded; }, renderManualPage);
    entryToggle.addEventListener("click", function (event) {
      event.stopPropagation();
      independentExpanded = !independentExpanded;
      setPlatformExpanded(stateKey, independentExpanded);
      renderIndependentRows();
      refitLayout();
    });
    var reduceMotion = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!reduceMotion && rotationSlotCount > 0 && rotationEntries.length > rotationSlotCount) {
      entryRotationTimers.push(setInterval(function () {
        if (independentExpanded || document.hidden || card.matches(":hover") ||
            card.contains(document.activeElement)) {
          return;
        }
        advanceRotation();
      }, ENTRY_ROTATE_MS));
    }
  } else if (periodicCollapses) {
    var expanded = expandedPlatformKeys.has(stateKey);
    // animate:切换按钮触发的重画给新行加入场动画,默认/展开收起的渲染不加
    var renderPeriodicRows = function (animate) {
      closeKeyPopovers();
      card.classList.toggle("is-expanded", expanded);
      if (pager) pager.hidden = expanded;
      setExpandedContent(expanded);
      if (!expanded) {
        body.textContent = "";
        appendEntries(body, manualPages[pageIndex], animate ? "rotating-slot" : undefined);
        // 收起时只给最短窗口(网关=每日)的合计块;其余窗口合计在展开视图里看
        if (cardTotals.length > 0) appendTotalBlock(body, cardTotals.slice(0, 1));
      }
      entryToggle.textContent = expanded
        ? "收起" : "+" + (entries.length - collapsedEntries.length);
      entryToggle.title = expanded
        ? "收起到精简用量"
        : (denseExpand ? "展开各账号每日用量" : "展开其余 " +
          (entries.length - collapsedEntries.length) + " 条用量");
      entryToggle.setAttribute("aria-label", entryToggle.title);
      entryToggle.setAttribute("aria-expanded", String(expanded));
    };
    entryToggle.addEventListener("click", function (event) {
      event.stopPropagation();
      expanded = !expanded;
      setPlatformExpanded(stateKey, expanded);
      renderPeriodicRows();
      refitLayout();
    });
    if (pager) bindPager(function () { return expanded; }, renderPeriodicRows);
    renderPeriodicRows();
  } else {
    appendEntries(body, entries);
  }
  card.appendChild(frag);
  return card;
}

function renderPlatformsAtMode(platforms, mode) {
  entryRotationTimers.forEach(function (timer) { clearInterval(timer); });
  entryRotationTimers = [];
  document.documentElement.dataset.density = mode;
  platformsEl.textContent = "";
  var identityCounts = Object.create(null);
  platforms.forEach(function (p) {
    var identity = JSON.stringify([String(p.name || ""), String(p.display_name || "")]);
    var occurrence = identityCounts[identity] || 0;
    identityCounts[identity] = occurrence + 1;
    var stateKey = JSON.stringify([
      String(p.name || ""), String(p.display_name || ""), occurrence
    ]);
    platformsEl.appendChild(platformCard(p, mode, stateKey));
  });
}

function pageFitsViewport() {
  return document.documentElement.scrollHeight <= Math.ceil(window.innerHeight) + 2;
}

// 展开/收起会改变卡片高度:立刻重跑一次密度试排,让「收起能放下、展开才
// 溢出」的场景也能落到 compact/ultra 口径,而不是等下一次 resize/刷新
function refitLayout() {
  if (lastPlatformData && lastPlatformData.length) renderPlatforms(lastPlatformData);
}

// 从信息最多的模式开始试排；终极压缩仍放不下时保留自然滚动。
function renderPlatforms(platforms) {
  lastPlatformData = platforms;
  var modes = ["normal", "compact", "ultra"];
  for (var i = 0; i < modes.length; i++) {
    renderPlatformsAtMode(platforms, modes[i]);
    if (pageFitsViewport()) return;
  }
}

// ---- 刷新循环 ----
// 首次加载后立即拉取；成功后按服务端 interval 秒调度下一次轮询。
// 失败时 10 秒后重试，不清空旧卡片。setInterval(1000) 同时维护：
// 1) 状态行中的「下次刷新 Ns」倒计时；2) 各 entry 的「重置倒计时」。

function schedule(sec) {
  clearTimeout(pollTimer);
  nextAt = Date.now() + sec * 1000;
  pollTimer = setTimeout(refresh, sec * 1000);
}

function render(data) {
  var fetched = parseReset(data.fetched_at);
  lastFetchedLocal = fmtTime(fetched || new Date());
  errorState = null;
  renderPlatforms(data.platforms || []);
  if (typeof data.interval === "number") currentInterval = data.interval;
  syncIntervalSelect(currentInterval);
  schedule(currentInterval);
}

// 统一的用量拉取:401 跳登录页,非 2xx 抛错(消息取响应 error 字段)。
async function fetchUsage(url, init) {
  var r = await fetch(url, init);
  if (r.status === 401) { location.href = "/login"; throw new Error("未登录"); }  // 会话失效
  var data = null;
  try { data = await r.json(); } catch (_) { /* 非 JSON 响应 */ }
  if (!r.ok) throw new Error((data && data.error) || ("HTTP " + r.status));
  return data;
}

async function refresh(force) {
  var requestId = ++usageRequestId;
  clearTimeout(pollTimer);  // 只取消排队轮询;在途请求由 requestId 隔离
  refreshing = true;
  if (force) refreshBtn.disabled = true;
  tick();
  try {
    var data = await fetchUsage(
      force ? "/api/refresh" : "/api/usage", force ? { method: "POST" } : undefined
    );
    if (requestId !== usageRequestId) return;
    render(data);
  } catch (e) {
    if (requestId !== usageRequestId || (e && e.message === "未登录")) return;
    errorState = String((e && e.message) || e);
    schedule(10);  // 10s 后重试,不清空旧卡片
  } finally {
    if (requestId === usageRequestId) {
      refreshing = false;
      refreshBtn.disabled = false;
      tick();
    }
  }
}

// ---- 手动刷新与间隔控制 ----
// 「马上刷新」POST /api/refresh:绕过自身及可见共享来源的配置缓存,
// 不失效无关用户的缓存。等待时保留旧卡片,持续显示加载/刷新提示;
// 仅最新请求的成功响应进入 render() 更新卡片并重新调度轮询。
// 间隔下拉 POST /api/interval:修改服务端 TTL;所有已打开的页面在
// 下次轮询响应的 interval 字段里收到新值后自行对齐。

var refreshBtn = document.getElementById("refresh-now");
var intervalSelect = document.getElementById("interval-select");

var INTERVAL_PRESETS = [10, 30, 60, 300, 600, 1800, 3600];

function intervalLabel(sec) {
  if (sec >= 3600 && sec % 3600 === 0) return (sec / 3600) + "小时";
  if (sec % 60 === 0) return (sec / 60) + "分钟";
  return Math.round(sec) + "秒";
}

// 把服务端间隔同步到下拉框:不在预设里的值(如 CLI --interval 45)
// 按数值升序插入动态选项,保证任意间隔都有选中项。
function syncIntervalSelect(sec) {
  if (typeof sec !== "number" || !(sec > 0)) return;
  sec = Math.round(sec);
  var value = String(sec);
  if (intervalSelect.value === value) return;
  var has = Array.prototype.some.call(
    intervalSelect.options, function (o) { return o.value === value; }
  );
  if (!has) {
    var opt = el("option");
    opt.value = value;
    opt.textContent = intervalLabel(sec);
    var before = Array.prototype.find.call(
      intervalSelect.options, function (o) { return Number(o.value) > sec; }
    );
    intervalSelect.insertBefore(opt, before || null);
  }
  intervalSelect.value = value;
}

INTERVAL_PRESETS.forEach(function (sec) {
  var opt = el("option");
  opt.value = String(sec);
  opt.textContent = intervalLabel(sec);
  intervalSelect.appendChild(opt);
});
intervalSelect.value = "60";  // 首次成功拉取前显示默认值

refreshBtn.addEventListener("click", function () {
  refresh(true);
});

intervalSelect.addEventListener("change", async function () {
  var sec = Number(intervalSelect.value);
  if (!sec || sec === currentInterval) return;
  intervalSelect.disabled = true;
  try {
    var data = await fetchUsage("/api/interval", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ interval: sec })
    });
    currentInterval = data.interval;
    syncIntervalSelect(currentInterval);
    schedule(currentInterval);  // 立即按新间隔重排「下次刷新」倒计时
  } catch (e) {
    if (e && e.message === "未登录") return;
    syncIntervalSelect(currentInterval);  // 失败回退到服务端当前值
    statusEl.textContent = "设置刷新间隔失败:" + String((e && e.message) || e);
  } finally {
    intervalSelect.disabled = false;
  }
});

// 每秒:重算重置倒计时 + 更新状态行
function tick() {
  var now = new Date();
  var cells = platformsEl.querySelectorAll("td.cd");
  for (var i = 0; i < cells.length; i++) {
    cells[i].textContent = fmtCountdown(
      cells[i].dataset.reset || null, now, cells[i].dataset.kind || null
    );
  }
  var remain = Math.max(0, Math.round((nextAt - Date.now()) / 1000));
  if (refreshing) {
    statusEl.textContent = (lastFetchedLocal || errorState) ? "刷新中…" : "加载中…";
    statusEl.className = "status";
  } else if (errorState) {
    statusEl.textContent = "获取失败：" + errorState + " · " + remain + "s 后重试";
    statusEl.className = "status err";
  } else if (lastFetchedLocal) {
    statusEl.textContent = lastFetchedLocal + " 获取 · " + remain + "s 后刷新";
    statusEl.className = "status";
  }
}

// 页面其它位置点击 / Escape:关闭弹层
document.addEventListener("click", closeKeyPopovers);
document.addEventListener("keydown", function (ev) {
  if (ev.key === "Escape") closeKeyPopovers();
});

// 调整窗口时重新从正常模式试排；80ms 防抖避免拖动过程中频繁重建 DOM。
window.addEventListener("resize", function () {
  clearTimeout(fitResizeTimer);
  fitResizeTimer = setTimeout(function () { renderPlatforms(lastPlatformData); }, 80);
});

refresh();
setInterval(tick, 1000);
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(function () {});
}
</script>
