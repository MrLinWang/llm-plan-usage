<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>供应商配置 - LLM 用量总览</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20x='1.5'%20y='12'%20width='3'%20height='6'%20rx='1'%20fill='%2356b6c2'/%3E%3Crect%20x='6'%20y='9'%20width='3'%20height='9'%20rx='1'%20fill='%23ffb300'/%3E%3Crect%20x='10.5'%20y='6'%20width='3'%20height='12'%20rx='1'%20fill='%234caf50'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #16181d;
    --fg: #d7dae0;
    --dim: #7a7f8a;
    --sep: #3a3f4a;
    --green: #4caf50;
    --yellow: #ffb300;
    --red: #ef5350;
    --cyan: #56b6c2;
    --track: #2c313c;
    --surface: #1c2027;
    --hover: rgba(255, 255, 255, 0.035);
    --glow: #1b2230;
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  }
  /* 浅色主题:覆盖同名变量,强调色取深一档以保证白底对比度 */
  html[data-theme="light"] {
    --bg: #f5f6f8;
    --fg: #24292f;
    --dim: #6e7781;
    --sep: #d0d7de;
    --green: #1a7f37;
    --yellow: #9a6700;
    --red: #cf222e;
    --cyan: #0a7ea4;
    --track: #e2e5ea;
    --surface: #ffffff;
    --hover: rgba(0, 0, 0, 0.03);
    --glow: #e9edf3;
    --shadow: 0 10px 30px rgba(27, 31, 36, 0.1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    background: radial-gradient(1100px 520px at 78% -8%, var(--glow), var(--bg) 62%);
    background-attachment: fixed;
    color: var(--fg);
    font-family: "Sarasa Mono SC", "Noto Sans Mono CJK SC", "PingFang SC",
                 "Microsoft YaHei", Consolas, "Courier New", monospace;
    font-size: 14px;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  #app { max-width: 1200px; margin: 0 auto; }
  .card {
    background: var(--surface);
    border: 1px solid var(--sep);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 14px 18px 12px;
    transition: background-color 0.25s ease, border-color 0.25s ease;
  }
  .card-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }
  .head-nav { display: flex; gap: 8px; flex: none; align-items: center; }
  /* 平台卡片网格:够宽时两列,窄屏自动单列 */
  #platforms {
    margin-top: 12px;
    display: grid;
    gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr));
  }
  .platform-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 8px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--sep);
  }
  .platform-name { font-weight: bold; }
  #theme-toggle, .pill-btn {
    flex: none;
    padding: 5px 16px;
    font: inherit;
    font-size: 13px;
    color: var(--dim);
    background: transparent;
    border: 1px solid var(--sep);
    border-radius: 999px;
    cursor: pointer;
    text-decoration: none;
    transition: color 0.2s ease, border-color 0.2s ease,
                background-color 0.2s ease, box-shadow 0.2s ease;
  }
  #theme-toggle:hover, .pill-btn:hover {
    color: var(--fg);
    border-color: var(--dim);
    background: var(--hover);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  }
  #theme-toggle:focus-visible, .pill-btn:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
  }
  .title {
    font-weight: bold;
    font-size: 17px;
    letter-spacing: 0.02em;
    margin-bottom: 6px;
    background: linear-gradient(90deg, var(--cyan), var(--green));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .status { color: var(--dim); font-size: 13px; }
  .dim { color: var(--dim); }
  .fields { display: grid; gap: 12px; }
  label { display: grid; gap: 5px; color: var(--dim); font-size: 13px; }
  label.check { display: flex; align-items: center; gap: 8px; }
  label.check input { width: auto; }
  input[type="text"], input[type="password"], input[type="number"] {
    font: inherit;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--sep);
    border-radius: 8px;
    padding: 7px 10px;
    width: 100%;
  }
  input[type="text"]:focus, input[type="password"]:focus, input[type="number"]:focus {
    outline: none;
    border-color: var(--cyan);
  }
  .groups-editor {
    display: grid;
    gap: 9px;
    margin-top: 2px;
    padding-top: 12px;
    border-top: 1px solid var(--sep);
  }
  .group-editor {
    display: grid;
    gap: 8px;
    padding: 10px;
    border: 1px solid var(--sep);
    border-radius: 9px;
    background: var(--hover);
  }
  .group-head, .group-actions, .key-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .group-head label { flex: 1; }
  .group-head label.limit { max-width: 180px; }
  .key-row input { flex: 1; }
  .key-row button, .group-actions button {
    flex: none;
    padding: 5px 10px;
    font: inherit;
    font-size: 12px;
    color: var(--dim);
    background: transparent;
    border: 1px solid var(--sep);
    border-radius: 999px;
    cursor: pointer;
  }
  .key-row button:hover, .group-actions button:hover {
    color: var(--fg);
    border-color: var(--dim);
  }
  .group-actions { justify-content: space-between; }
  .group-actions .danger { color: var(--red); }
  @media (max-width: 620px) {
    .group-head { align-items: stretch; flex-direction: column; }
    .group-head label.limit { max-width: none; }
  }
  .hint { font-size: 12px; color: var(--dim); }
  .card-foot { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .btn {
    padding: 7px 22px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--bg);
    background: var(--cyan);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: filter 0.2s ease;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .form-err { color: var(--red); font-size: 13px; }
  .form-ok { color: var(--green); font-size: 13px; }
  .platform-head-left { display: flex; align-items: center; }
  .drag-handle { cursor: grab; color: var(--dim); user-select: none; padding-right: 8px; }
  .card.platform.dragging { opacity: 0.4; }
  .card.platform.drag-over { border-top: 2px solid var(--cyan); }
</style>
<script>
// 首屏前确定主题,避免闪烁:localStorage 优先,其次系统偏好,默认深色。
(function () {
  var t = null;
  try { t = localStorage.getItem("llm-usage-theme"); } catch (_) {}
  if (t !== "light" && t !== "dark") {
    t = (window.matchMedia &&
         matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
  }
  document.documentElement.dataset.theme = t;
})();
</script>
</head>
<body>
<div id="app">
  <div class="card">
    <div class="card-head">
      <div>
        <div class="title">供应商配置</div>
        <div id="status" class="status">加载中…</div>
      </div>
      <div class="head-nav">
        <a class="pill-btn" href="/">仪表盘</a>
        <a class="pill-btn" href="/users">用户管理</a>
        <button id="theme-toggle" type="button" title="切换浅色/深色主题">浅色</button>
      </div>
    </div>
  </div>
  <div id="platforms"></div>
</div>
<script>
"use strict";

// ---- 主题切换(与 index.html 一致) ----
var THEME_KEY = "llm-usage-theme";

function syncThemeButton() {
  var light = document.documentElement.dataset.theme === "light";
  document.getElementById("theme-toggle").textContent = light ? "深色" : "浅色";
}

document.getElementById("theme-toggle").addEventListener("click", function () {
  var light = document.documentElement.dataset.theme === "light";
  var next = light ? "dark" : "light";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem(THEME_KEY, next); } catch (_) {}
  syncThemeButton();
});
syncThemeButton();

// ---- 工具 ----
var platformsEl = document.getElementById("platforms");
var statusEl = document.getElementById("status");

// 任何 401 都说明会话已失效,回登录页
async function api(url, opts) {
  var r = await fetch(url, opts);
  if (r.status === 401) { location.href = "/login"; throw new Error("未登录"); }
  return r;
}

async function detailOf(r) {
  var data = null;
  try { data = await r.json(); } catch (_) { /* 非 JSON 响应 */ }
  return (data && data.detail) || ("HTTP " + r.status);
}

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// 凭证输入框 placeholder:env 引用原样显示;已设置的字面量显示脱敏提示;否则未设置
function placeholderOf(cred) {
  if (!cred) return "未设置";
  if (cred.env) return "当前: " + cred.env;
  if (cred.set) return "已设置 (" + cred.hint + ")";
  return "未设置";
}

// 各平台凭证槽字段(与服务端 CREDENTIAL_FIELDS 一致);每个槽 = 一个独立计费套餐
var SLOT_FIELDS = {
  "kimi": ["api_key"],
  "volcengine-coding": ["access_key", "secret_key"],
  "volcengine-agent": ["access_key", "secret_key"],
  "ollama": ["api_key"],
  "opencode-go": ["api_key"],
};

// ---- 平台卡片 ----
// 每张卡片:标题(display_name + key)、启用 checkbox、凭证编辑区、保存按钮。
// 非 gateway 平台 = 凭证槽编辑器(每槽一个套餐);gateway = base_url 输入 + 分组编辑器。
// 输入留空 = 不修改;保存后服务端使缓存失效,下次刷新生效。

function platformCard(p) {
  var card = el("div", "card platform");
  card.dataset.key = p.key;

  var head = el("div", "platform-head");
  var headLeft = el("div", "platform-head-left");
  var handle = el("span", "drag-handle", "⠿");
  handle.draggable = true;  // 仅手柄可拖,输入框/文本选择不受影响
  handle.title = "拖动调整顺序";
  headLeft.appendChild(handle);
  headLeft.appendChild(el("span", "platform-name", p.display_name));
  head.appendChild(headLeft);
  head.appendChild(el("span", "dim", p.key));
  card.appendChild(head);

  var fields = el("div", "fields");

  var enableLabel = el("label", "check");
  var enableBox = document.createElement("input");
  enableBox.type = "checkbox";
  enableBox.checked = !!p.enabled;
  enableLabel.appendChild(enableBox);
  enableLabel.appendChild(document.createTextNode("启用"));
  fields.appendChild(enableLabel);

  var slotEditors = [];
  var slotFields = SLOT_FIELDS[p.key] || null;

  var renderSlots = function (slots) {
    if (!slotFields) return;
    if (!Array.isArray(slots) || !slots.length) {
      slots = [{ index: null, name: null, credentials: {} }];
    }
    slotEditors = [];
    slotsEditor.textContent = "";
    slots.forEach(function (slot, position) {
      var box = el("div", "group-editor");
      var head = el("div", "group-head");
      var nameLabel = el("label", "", "套餐名");
      var nameInput = document.createElement("input");
      nameInput.type = "text";
      nameInput.autocomplete = "off";
      nameInput.placeholder = "套餐名（可选）";
      if (slot.name) nameInput.value = slot.name;
      nameLabel.appendChild(nameInput);
      head.appendChild(nameLabel);
      box.appendChild(head);

      var slotFieldsEl = el("div", "fields");
      var slotInputs = {};
      slotFields.forEach(function (field) {
        var cred = (slot.credentials || {})[field];
        var label = el("label", "", field);
        var input = document.createElement("input");
        input.type = "text";
        input.autocomplete = "off";
        input.placeholder = placeholderOf(cred);
        slotInputs[field] = input;
        label.appendChild(input);
        slotFieldsEl.appendChild(label);
      });
      box.appendChild(slotFieldsEl);

      var actions = el("div", "group-actions");
      var removeSlot = el("button", "danger", "删除此凭证");
      removeSlot.type = "button";
      removeSlot.addEventListener("click", function () {
        box.remove();
        slotEditors = slotEditors.filter(function (item) { return item.box !== box; });
      });
      actions.appendChild(removeSlot);
      box.appendChild(actions);
      slotsEditor.appendChild(box);

      slotEditors.push({
        box: box,
        originalIndex: slot.index,
        nameInput: nameInput,
        inputs: slotInputs,
      });
    });
    var addSlot = el("button", "", addSlotLabel);
    addSlot.type = "button";
    addSlot.addEventListener("click", function () {
      var current = slotEditorsToSlots();
      current.push({ index: null, name: null, credentials: {} });
      renderSlots(current);
    });
    slotsEditor.appendChild(addSlot);
  };

  // 当前编辑器内容 → 槽数组(每字段空串 → null = 保留)
  function slotEditorsToSlots() {
    return slotEditors.map(function (editor) {
      var slot = { index: editor.originalIndex, name: null };
      if (editor.nameInput && editor.nameInput.value.trim()) {
        slot.name = editor.nameInput.value.trim();
      }
      slotFields.forEach(function (field) {
        var value = editor.inputs[field].value.trim();
        slot[field] = value || null;
      });
      return slot;
    });
  }

  var groupEditors = [];
  var renderGroups = function () {};
  var slotsEditor = null;
  var addSlotLabel = "添加凭证";
  var baseUrlInput = null;
  if (slotFields) {
    if (p.key === "volcengine-coding" || p.key === "volcengine-agent") {
      addSlotLabel = "添加 AK/SK";
    }
    slotsEditor = el("div", "groups-editor");
    fields.appendChild(slotsEditor);
    renderSlots(p.credential_slots || []);
  } else if (p.key === "llm-gateway") {
    // base_url 是 gateway 的必填配置,直接在此编辑
    var baseUrlLabel = el("label", "", "base_url");
    baseUrlInput = document.createElement("input");
    baseUrlInput.type = "text";
    baseUrlInput.autocomplete = "off";
    baseUrlInput.placeholder = "http://127.0.0.1:18080";
    if (p.base_url) baseUrlInput.value = p.base_url;
    baseUrlLabel.appendChild(baseUrlInput);
    fields.appendChild(baseUrlLabel);
    var serverGroups = p.groups || [];
    var groupsEditor = el("div", "groups-editor");
    fields.appendChild(groupsEditor);
    renderGroups = function (groups) {
      if (!Array.isArray(groups) || !groups.length) {
        // 默认一组:一个 key 输入框 + 每日限额
        groups = [{ name: "组1", daily_limit: null, api_keys: [] }];
      }
      groupEditors = [];
      groupsEditor.textContent = "";
      groups.forEach(function (group, position) {
        var box = el("div", "group-editor");
        var head = el("div", "group-head");
        var nameLabel = el("label", "", "分组名称");
        var nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.value = group.name || ("组" + (position + 1));
        nameInput.autocomplete = "off";
        nameLabel.appendChild(nameInput);
        head.appendChild(nameLabel);

        var limitLabel = el("label", "limit", "每日限额 ($)");
        var limitInput = document.createElement("input");
        limitInput.type = "number";
        limitInput.min = "0";
        limitInput.step = "any";
        limitInput.value = group.daily_limit === null || group.daily_limit === undefined
          ? "" : String(group.daily_limit);
        limitLabel.appendChild(limitInput);
        head.appendChild(limitLabel);
        box.appendChild(head);

        var keysEl = el("div", "fields");
        var rows = [];
        function addKey(cred, existingIndex, initialValue) {
          if (cred && Object.prototype.hasOwnProperty.call(cred, "value")) {
            existingIndex = cred.index;
            initialValue = cred.value || "";
            cred = null;
          }
          var row = el("div", "key-row");
          var input = document.createElement("input");
          input.type = "text";
          input.autocomplete = "off";
          input.placeholder = cred ? placeholderOf(cred) : "API key 或 env:VARNAME";
          if (initialValue) input.value = initialValue;
          var remove = el("button", "", "删除");
          remove.type = "button";
          remove.addEventListener("click", function () {
            row.remove();
            var rowIndex = rows.indexOf(row);
            if (rowIndex >= 0) rows.splice(rowIndex, 1);
          });
          row.appendChild(input);
          row.appendChild(remove);
          keysEl.appendChild(row);
          rows.push({ row: row, input: input, existingIndex: existingIndex });
        }
        var groupKeys = Array.isArray(group.api_keys) ? group.api_keys : [];
        if (groupKeys.length) {
          groupKeys.forEach(function (cred, keyIndex) { addKey(cred, keyIndex); });
        } else {
          addKey(null, null);  // 每组默认一个 API key 输入框
        }
        var addKeyButton = el("button", "", "添加共享 Key");
        addKeyButton.type = "button";
        addKeyButton.addEventListener("click", function () { addKey(null, null); });
        keysEl.appendChild(addKeyButton);
        box.appendChild(keysEl);

        var actions = el("div", "group-actions");
        var removeGroup = el("button", "danger", "删除此分组");
        removeGroup.type = "button";
        removeGroup.addEventListener("click", function () {
          box.remove();
          groupEditors = groupEditors.filter(function (item) { return item.box !== box; });
        });
        actions.appendChild(removeGroup);
        box.appendChild(actions);
        groupsEditor.appendChild(box);

        groupEditors.push({
          box: box,
          originalIndex: group.index,
          nameInput: nameInput,
          limitInput: limitInput,
          rows: rows,
        });
      });
      var addGroup = el("button", "", "添加组");
      addGroup.type = "button";
      addGroup.addEventListener("click", function () {
        var current = groupEditors.map(function (editor) {
          var currentGroup = {
            name: editor.nameInput.value.trim(),
            daily_limit: editor.limitInput.value.trim() === ""
              ? null : Number(editor.limitInput.value),
            api_keys: editor.rows.map(function (row) {
              var value = row.input.value.trim();
              if (row.existingIndex !== null && row.existingIndex !== undefined) {
                return { index: row.existingIndex, value: value || null };
              }
              return value ? { index: null, value: value } : null;
            }).filter(function (value) { return value !== null; }),
          };
          if (editor.originalIndex !== null && editor.originalIndex !== undefined) {
            currentGroup.index = editor.originalIndex;
          }
          return currentGroup;
        });
        current.push({
          name: "组" + (current.length + 1), daily_limit: null, api_keys: [], index: null,
        });
        renderGroups(current);
      });
      groupsEditor.appendChild(addGroup);
    };
    renderGroups(serverGroups);
  }

  fields.appendChild(el("div", "hint", "留空保持不变；支持 env:VARNAME 引用环境变量"));  card.appendChild(fields);

  var foot = el("div", "card-foot");
  var save = el("button", "btn", "保存");
  save.type = "button";
  var errEl = el("span", "form-err");
  var okEl = el("span", "form-ok");
  save.addEventListener("click", async function () {
    errEl.textContent = "";
    okEl.textContent = "";
    save.disabled = true;
    try {
      var body = { enabled: enableBox.checked };
      if (slotFields) {
        body.credential_slots = slotEditorsToSlots();
      }
      if (p.key === "llm-gateway") {
        if (baseUrlInput && baseUrlInput.value.trim()) {
          body.base_url = baseUrlInput.value.trim();
        }
        body.groups = groupEditors.map(function (editor) {
          var group = { name: editor.nameInput.value.trim(), api_keys: [] };
          if (editor.originalIndex !== null && editor.originalIndex !== undefined) {
            group.index = editor.originalIndex;
          }
          var limit = editor.limitInput.value.trim();
          group.daily_limit = limit === "" ? null : Number(limit);
          editor.rows.forEach(function (row) {
            var value = row.input.value.trim();
            if (row.existingIndex === null || row.existingIndex === undefined) {
              if (value) group.api_keys.push(value);
            } else {
              group.api_keys.push({
                index: row.existingIndex,
                value: value || null,
              });
            }
          });
          return group;
        });
      }
      var r = await api("/api/config/platforms/" + encodeURIComponent(p.key), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!r.ok) { errEl.textContent = await detailOf(r); return; }
      var updated = await r.json();
      // 用服务端返回的视图刷新(清空输入 + 新 placeholder)
      if (slotFields) {
        renderSlots(updated.credential_slots || []);
      }
      if (p.key === "llm-gateway") {
        serverGroups = updated.groups || [];
        renderGroups(serverGroups);
        if (baseUrlInput) {
          baseUrlInput.value = "";
          baseUrlInput.placeholder = updated.base_url || "http://127.0.0.1:18080";
        }
      }
      enableBox.checked = !!updated.enabled;
      okEl.textContent = "已保存，下次刷新生效";
    } catch (e) {
      if (e && e.message !== "未登录") errEl.textContent = String(e.message || e);
    } finally {
      save.disabled = false;
    }
  });
  foot.appendChild(save);
  foot.appendChild(okEl);
  foot.appendChild(errEl);
  card.appendChild(foot);
  return card;
}

// ---- 拖动排序(落点即保存,与 interval 下拉的即时生效模式一致) ----
// 事件委托在 #platforms 容器上;只有 .drag-handle 可拖。
// 拖放成功后不重渲染:DOM 顺序已是新顺序,下次 load() 会按新顺序渲染。

var dragCard = null;      // 正在被拖动的卡片
var currentOrder = [];    // 服务端确认的顺序(load/persistOrder 更新)

function cardOf(node) {
  return node && node.closest ? node.closest(".card.platform") : null;
}

function clearDragOver() {
  platformsEl.querySelectorAll(".card.platform.drag-over").forEach(function (c) {
    c.classList.remove("drag-over");
  });
}

platformsEl.addEventListener("dragstart", function (ev) {
  var handle = ev.target && ev.target.closest ? ev.target.closest(".drag-handle") : null;
  if (!handle) { ev.preventDefault(); return; }
  dragCard = cardOf(handle);
  if (!dragCard) return;
  dragCard.classList.add("dragging");
  ev.dataTransfer.effectAllowed = "move";
  try { ev.dataTransfer.setData("text/plain", dragCard.dataset.key || ""); } catch (_) {}
});

platformsEl.addEventListener("dragover", function (ev) {
  if (!dragCard) return;
  ev.preventDefault();  // 允许放置
  ev.dataTransfer.dropEffect = "move";
  var target = cardOf(ev.target);
  clearDragOver();
  if (target && target !== dragCard) target.classList.add("drag-over");
});

platformsEl.addEventListener("dragleave", function (ev) {
  var target = cardOf(ev.target);
  if (target && !target.contains(ev.relatedTarget)) target.classList.remove("drag-over");
});

platformsEl.addEventListener("drop", function (ev) {
  if (!dragCard) return;
  ev.preventDefault();
  var target = cardOf(ev.target);
  clearDragOver();
  if (target === dragCard) return;
  if (target) {
    platformsEl.insertBefore(dragCard, target);  // 指示线在上:插入目标之前
  } else {
    platformsEl.appendChild(dragCard);           // 空白处:移到最后
  }
  persistOrder();
});

platformsEl.addEventListener("dragend", function () {
  if (dragCard) dragCard.classList.remove("dragging");
  dragCard = null;
  clearDragOver();
});

async function persistOrder() {
  var keys = Array.prototype.map.call(
    platformsEl.querySelectorAll(".card.platform"),
    function (c) { return c.dataset.key; }
  );
  if (keys.join(",") === currentOrder.join(",")) return;  // 顺序未变
  try {
    var r = await api("/api/config/order", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ order: keys }),
    });
    if (!r.ok) {
      statusEl.textContent = "顺序保存失败: " + (await detailOf(r));
      load();  // 恢复 DOM 为服务端顺序
      return;
    }
    var data = await r.json();
    currentOrder = data.order || keys;
    statusEl.textContent = "顺序已保存";
  } catch (e) {
    if (e && e.message !== "未登录") {
      statusEl.textContent = "顺序保存失败: " + String(e.message || e);
      load();
    }
  }
}

async function load() {
  try {
    var r = await api("/api/config");
    if (!r.ok) { statusEl.textContent = await detailOf(r); return; }
    var data = await r.json();
    currentOrder = (data.platforms || []).map(function (p) { return p.key; });
    platformsEl.textContent = "";
    (data.platforms || []).forEach(function (p) {
      platformsEl.appendChild(platformCard(p));
    });
    statusEl.textContent = "修改将写入 config.toml";
  } catch (e) {
    if (e && e.message !== "未登录") statusEl.textContent = String(e.message || e);
  }
}

// ---- 启动 ----
api("/api/auth/state").then(function (r) { return r.json(); }).then(function (s) {
  if (!s.authenticated) { location.href = "/login"; return; }
  if (!s.user || !s.user.is_admin) { location.href = "/"; return; }
  load();
});
</script>
</body>
</html>
